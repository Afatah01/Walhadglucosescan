name: Build and release v5.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the signing keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/walhad-release.keystore -alias walhad -keyalg RSA -keysize 2048 -validity 10000 -storepass walhad2026scan -keypass walhad2026scan -dname "CN=Walhad Glucose Scan, O=Walhad, C=SO"
          printf 'storeFile=walhad-release.keystore\nstorePassword=walhad2026scan\nkeyAlias=walhad\nkeyPassword=walhad2026scan\n' > keystore/keystore.properties

      - name: Draw the launcher icons
        run: python3 tools/make_icon.py

      - name: Run the tests and build the APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Publish release v5.1.0 with the APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" Walhad-GlucoseScan-v5.1.0.apk
          SHA=$(sha256sum Walhad-GlucoseScan-v5.1.0.apk | cut -d' ' -f1)
          gh release delete v5.1.0 --yes --cleanup-tag || true
          gh release create v5.1.0 Walhad-GlucoseScan-v5.1.0.apk --title "Walhad Glucose Scan 5.1.0" --notes "Built by GitHub Actions from commit ${GITHUB_SHA}. New in 5.1.0: the launcher icon is drawn anew for every phone size, and the analysis can be saved as a PDF (Downloads folder) and shared with any app. Groq (openai/gpt-oss-120b) is built in - no key to paste, answers in English. 15/30-minute forecasts use the last hour of real readings. Installs directly over 5.0.0. It still does not replace 4.3 and older: uninstall that one first. sha256 of the APK: $SHA"
